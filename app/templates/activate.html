<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Activate Tag – TapTag</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:   #000;
      --t1:   #f5f5f7;
      --t2:   #a1a1a6;
      --t3:   #6e6e73;
      --blue: #2997ff;
      --red:  #ff453a;
      --line: rgba(255,255,255,0.08);
    }

    html, body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--t1);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom));
      position: relative; overflow: hidden;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 50% at 50% -5%, rgba(41,151,255,.22), transparent 60%),
        radial-gradient(ellipse 50% 40% at 10% 85%,  rgba(120,60,255,.10), transparent 55%),
        radial-gradient(ellipse 45% 35% at 90% 70%,  rgba(191,90,242,.08), transparent 55%);
    }

    /* Card */
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 380px;
      background:
        radial-gradient(ellipse 90% 50% at 20% 0%, rgba(255,255,255,0.09) 0%, transparent 65%),
        rgba(255,255,255,0.055);
      backdrop-filter: blur(32px) saturate(180%) brightness(1.04);
      -webkit-backdrop-filter: blur(32px) saturate(180%) brightness(1.04);
      border: 1px solid rgba(255,255,255,0.13);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.26),
        0 24px 64px rgba(0,0,0,0.5);
      border-radius: 26px;
      padding: 36px 28px 32px;
      animation: fadeUp .45s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* NFC icon */
    .nfc-icon {
      width: 54px; height: 54px; border-radius: 16px; margin: 0 auto 20px;
      background: linear-gradient(135deg, rgba(41,151,255,.25), rgba(191,90,242,.20));
      border: 1px solid rgba(41,151,255,.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }

    .card-title {
      font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
      text-align: center; margin-bottom: 6px;
    }
    .card-sub {
      font-size: 14px; color: var(--t2); text-align: center;
      line-height: 1.5; margin-bottom: 28px;
    }
    .tag-pill {
      display: inline-block;
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; padding: 3px 10px; border-radius: 99px;
      background: rgba(41,151,255,.15); color: rgba(100,185,255,.9);
      border: 1px solid rgba(41,151,255,.25); margin-bottom: 4px;
    }

    /* Tabs */
    .tabs {
      display: flex; gap: 4px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      border-radius: 12px; padding: 4px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1; text-align: center; padding: 8px 0;
      font-size: 14px; font-weight: 600; cursor: pointer;
      border-radius: 9px; color: var(--t3);
      transition: background .18s, color .18s;
    }
    .tab.active {
      background: rgba(255,255,255,0.12);
      color: var(--t1);
    }

    /* Panels */
    .panel { display: none; }
    .panel.active { display: block; }

    /* Form fields */
    .fg { margin-bottom: 14px; }
    .fg label {
      display: block; font-size: 11px; font-weight: 600;
      color: var(--t3); letter-spacing: .8px; text-transform: uppercase;
      margin-bottom: 7px;
    }
    .fg input {
      width: 100%; padding: 12px 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px; font-size: 15px;
      color: var(--t1); font-family: inherit; outline: none;
      transition: border-color .18s, background .18s;
    }
    .fg input::placeholder { color: var(--t3); }
    .fg input:focus {
      border-color: var(--blue);
      background: rgba(41,151,255,0.08);
    }
    .fg input.err { border-color: var(--red); }
    .fg input.ok  { border-color: #32d74b; }

    /* Strength bar */
    .str-wrap { height: 3px; border-radius: 3px; background: rgba(255,255,255,0.08); margin-top: 8px; overflow: hidden; }
    .str-bar   { height: 100%; border-radius: 3px; width: 0; transition: width .25s, background .25s; }

    /* Pw toggle */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 44px; }
    .pw-eye {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 18px;
      line-height: 1; color: var(--t3); padding: 4px;
    }

    /* Error */
    .err-msg {
      font-size: 13px; color: var(--red); margin-top: 12px;
      display: none; text-align: center; line-height: 1.4;
    }

    /* Submit */
    .btn-submit {
      width: 100%; padding: 14px; margin-top: 8px;
      background: var(--blue); color: #fff;
      border: none; border-radius: 13px;
      font-size: 16px; font-weight: 600; font-family: inherit;
      cursor: pointer; position: relative;
      transition: opacity .18s, transform .18s;
    }
    .btn-submit:hover { opacity: .88; }
    .btn-submit:active { transform: scale(.98); }
    .btn-submit:disabled { opacity: .45; cursor: default; }
    .spinner {
      display: none; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    }
    @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

    /* Footer */
    .footer-link {
      text-align: center; margin-top: 20px;
      font-size: 13px; color: var(--t3);
    }
    .footer-link a { color: var(--blue); text-decoration: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="nfc-icon">📡</div>
  <div style="text-align:center;margin-bottom:10px;">
    <span class="tag-pill">{{ tag_id }}</span>
  </div>
  <h1 class="card-title">Claim Your Tag</h1>
  <p class="card-sub">You just tapped a TapTag. Sign in or create an account to activate it.</p>

  <div class="tabs">
    <div class="tab active" id="tab-reg" onclick="switchTab('register')">Create Account</div>
    <div class="tab"        id="tab-log" onclick="switchTab('login')">Log In</div>
  </div>

  <!-- Register -->
  <div class="panel active" id="panel-register">
    <div class="fg">
      <label>Email</label>
      <input type="email" id="reg-email" placeholder="you@example.com" oninput="validateRegEmail()">
    </div>
    <div class="fg">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="reg-password" placeholder="Min 8 chars + number or symbol"
               oninput="validateRegPw()">
        <button type="button" class="pw-eye" onclick="togglePw('reg-password',this)">🙈</button>
      </div>
      <div class="str-wrap"><div class="str-bar" id="str-bar"></div></div>
    </div>
    <button class="btn-submit" id="reg-btn" onclick="doRegister()" disabled>
      Create Account &amp; Activate
      <div class="spinner" id="reg-spin"></div>
    </button>
    <p class="err-msg" id="reg-err"></p>
  </div>

  <!-- Login -->
  <div class="panel" id="panel-login">
    <div class="fg">
      <label>Email</label>
      <input type="email" id="log-email" placeholder="you@example.com">
    </div>
    <div class="fg">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="log-password" placeholder="Your password">
        <button type="button" class="pw-eye" onclick="togglePw('log-password',this)">🙈</button>
      </div>
    </div>
    <button class="btn-submit" id="log-btn" onclick="doLogin()">
      Log In &amp; Activate
      <div class="spinner" id="log-spin"></div>
    </button>
    <p class="err-msg" id="log-err"></p>
  </div>

  <div class="footer-link">
    <a href="/">← Back to TapTag</a>
  </div>
</div>

<script>
  const TAG_ID = "{{ tag_id }}";
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  let regEmailOk = false, regPwOk = false;

  /* ── Tab switch ─────────────────────────────────────── */
  function switchTab(tab) {
    ['register','login'].forEach(t => {
      document.getElementById(`tab-${t==='register'?'reg':'log'}`).classList.toggle('active', t===tab);
      document.getElementById(`panel-${t}`).classList.toggle('active', t===tab);
    });
  }

  /* ── Password toggle ────────────────────────────────── */
  function togglePw(id, btn) {
    const inp = document.getElementById(id);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.textContent = show ? '🐵' : '🙈';
  }

  /* ── Register validation ────────────────────────────── */
  const STR_COLORS = ['#ff453a','#ff9f0a','#ffd60a','#30d158','#32d74b'];
  const STR_LABELS = ['Too weak','Weak','Fair','Good','Strong'];

  function strengthScore(pw) {
    let s = 0;
    if (pw.length >= 8)  s++;
    if (pw.length >= 12) s++;
    if (/[A-Z]/.test(pw)) s++;
    if (/[0-9]/.test(pw)) s++;
    if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pw)) s++;
    return Math.min(s, 4);
  }

  function validateRegEmail() {
    const el = document.getElementById('reg-email');
    regEmailOk = EMAIL_RE.test(el.value.trim());
    el.classList.toggle('ok', regEmailOk);
    el.classList.toggle('err', el.value && !regEmailOk);
    updateRegBtn();
  }

  function validateRegPw() {
    const el  = document.getElementById('reg-password');
    const pw  = el.value;
    const sc  = strengthScore(pw);
    const bar = document.getElementById('str-bar');
    bar.style.width = pw ? ((sc+1)/5*100)+'%' : '0';
    bar.style.background = pw ? STR_COLORS[sc] : '';
    regPwOk = pw.length >= 8 && /[0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(pw);
    el.classList.toggle('ok', regPwOk);
    el.classList.toggle('err', pw && !regPwOk);
    updateRegBtn();
  }

  function updateRegBtn() {
    document.getElementById('reg-btn').disabled = !(regEmailOk && regPwOk);
  }

  /* ── Register ───────────────────────────────────────── */
  async function doRegister() {
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const errEl    = document.getElementById('reg-err');
    const btn      = document.getElementById('reg-btn');
    const spin     = document.getElementById('reg-spin');
    errEl.style.display = 'none';
    btn.disabled = true; spin.style.display = 'block';
    try {
      const res = await fetch('/users/register', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email, password })
      });
      if (res.status === 429) { showErr('reg-err','Too many attempts. Wait a minute.'); return; }
      if (!res.ok) { const d = await res.json(); showErr('reg-err', d.detail||'Registration failed.'); return; }
      await bindTag();
    } catch { showErr('reg-err','Network error — try again.'); }
    finally { btn.disabled = false; spin.style.display = 'none'; updateRegBtn(); }
  }

  /* ── Login ──────────────────────────────────────────── */
  async function doLogin() {
    const email    = document.getElementById('log-email').value.trim();
    const password = document.getElementById('log-password').value;
    const errEl    = document.getElementById('log-err');
    const btn      = document.getElementById('log-btn');
    const spin     = document.getElementById('log-spin');
    errEl.style.display = 'none';
    btn.disabled = true; spin.style.display = 'block';
    try {
      const res = await fetch('/users/login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ email, password })
      });
      if (res.status === 429) { showErr('log-err','Too many attempts. Wait a minute.'); return; }
      if (!res.ok) { const d = await res.json(); showErr('log-err', d.detail||'Login failed.'); return; }
      await bindTag();
    } catch { showErr('log-err','Network error — try again.'); }
    finally { btn.disabled = false; spin.style.display = 'none'; }
  }

  /* ── Bind & redirect ────────────────────────────────── */
  async function bindTag() {
    await fetch(`/tags/bind/${TAG_ID}`, { method: 'POST' });
    window.location.href = `/tags/dashboard/${TAG_ID}`;
  }

  function showErr(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg; el.style.display = 'block';
  }
</script>
</body>
</html>
