<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Activate Tag – TapTag</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #000; --t1: #f5f5f7; --t2: #a1a1a6; --t3: #6e6e73;
      --blue: #2997ff; --line: rgba(255,255,255,0.08);
    }
    html, body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background: var(--bg); color: var(--t1);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; position: relative; overflow: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 50% at 50% -5%, rgba(41,151,255,.22), transparent 60%),
        radial-gradient(ellipse 50% 40% at 10% 85%, rgba(120,60,255,.10), transparent 55%),
        radial-gradient(ellipse 45% 35% at 90% 70%, rgba(191,90,242,.08), transparent 55%);
    }
    .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 360px;
      background:
        radial-gradient(ellipse 90% 50% at 20% 0%, rgba(255,255,255,0.09) 0%, transparent 65%),
        rgba(255,255,255,0.055);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.13);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.26), 0 24px 64px rgba(0,0,0,0.5);
      border-radius: 26px;
      padding: 40px 28px 36px;
      text-align: center;
      animation: fadeUp .45s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .nfc-icon {
      width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 22px;
      background: linear-gradient(135deg, rgba(41,151,255,.28), rgba(191,90,242,.22));
      border: 1px solid rgba(41,151,255,.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
    }
    .tag-pill {
      display: inline-block;
      font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      padding: 3px 10px; border-radius: 99px;
      background: rgba(41,151,255,.15); color: rgba(100,185,255,.9);
      border: 1px solid rgba(41,151,255,.25); margin-bottom: 14px;
    }
    h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.6px; margin-bottom: 8px; }
    .sub { font-size: 15px; color: var(--t2); line-height: 1.55; margin-bottom: 32px; }

    .btn {
      display: block; width: 100%; padding: 14px;
      border-radius: 14px; font-size: 16px; font-weight: 600;
      font-family: inherit; cursor: pointer; text-decoration: none;
      transition: opacity .18s, transform .18s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--blue); color: #fff; border: none; margin-bottom: 10px; }
    .btn-primary:hover { opacity: .88; }
    .btn-secondary {
      background: rgba(255,255,255,0.08); color: var(--t1);
      border: 1px solid var(--line);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.13); }

    .divider {
      font-size: 12px; color: var(--t3);
      margin: 14px 0 4px;
    }

    .footer {
      margin-top: 24px; font-size: 13px; color: var(--t3);
    }
    .footer a { color: var(--blue); text-decoration: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="nfc-icon">📡</div>
  <div class="tag-pill">{{ tag_id }}</div>
  <h1>You found a TapTag</h1>
  <p class="sub">Claim this tag to control where it points — no app needed.</p>

  <a class="btn btn-primary" id="btn-register" href="/register?bind={{ tag_id }}">
    Create Account
  </a>
  <div class="divider">Already have an account?</div>
  <a class="btn btn-secondary" id="btn-login" href="/login?bind={{ tag_id }}">
    Log In
  </a>

  <div class="footer">
    <a href="/">← Back to TapTag</a>
  </div>
</div>

<script>
  (async () => {
    const TAG_ID = "{{ tag_id }}";
    try {
      const res = await fetch('/tags/my');
      if (!res.ok) return; // not logged in — show register/login buttons

      const tags = await res.json();
      const alreadyOwned = tags.some(t => t.id === TAG_ID);

      if (alreadyOwned) {
        // Already mine — go straight to dashboard
        window.location.replace(`/tags/dashboard/${TAG_ID}`);
        return;
      }

      // Logged in but this tag is unclaimed — show a confirm button instead of auto-binding
      document.getElementById('btn-register').style.display = 'none';
      document.querySelector('.divider').style.display = 'none';
      document.getElementById('btn-login').style.display = 'none';

      const claim = document.createElement('button');
      claim.className = 'btn btn-primary';
      claim.textContent = 'Add to my account';
      claim.onclick = async () => {
        claim.textContent = 'Adding…';
        claim.disabled = true;
        await fetch(`/tags/bind/${TAG_ID}`, { method: 'POST' });
        window.location.replace(`/tags/dashboard/${TAG_ID}`);
      };
      document.querySelector('.sub').insertAdjacentElement('afterend', claim);
    } catch {}
  })();
</script>
</body>
</html>
