<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contact – TapTag</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #000; --t1: #f5f5f7; --t2: #a1a1a6; --t3: #6e6e73;
      --blue: #2997ff; --line: rgba(255,255,255,0.08);
    }
    html, body {
      min-height: 100vh; overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      background: var(--bg); color: var(--t1);
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 65% 50% at 50% -5%, rgba(41,151,255,.18), transparent 60%),
        radial-gradient(ellipse 45% 40% at 10% 80%, rgba(120,60,255,.09), transparent 55%);
    }

    /* Nav */
    nav {
      position: sticky; top: 0; z-index: 100;
      height: 48px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 22px;
      background: rgba(0,0,0,0.72);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--line);
    }
    .nav-logo { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; text-decoration: none; color: var(--t1); }
    .nav-back  { font-size: 13px; font-weight: 500; color: var(--blue); text-decoration: none; padding: 6px 14px; border-radius: 99px; transition: background .15s; }
    .nav-back:hover { background: rgba(41,151,255,.12); }

    /* Layout */
    .page {
      max-width: 520px; margin: 0 auto;
      padding: 64px 24px 80px;
      position: relative; z-index: 1;
    }
    .eyebrow {
      font-size: 12px; font-weight: 600; letter-spacing: 2.5px;
      text-transform: uppercase; color: var(--blue);
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(36px, 8vw, 60px);
      font-weight: 700; letter-spacing: -2px; line-height: 1.04;
      margin-bottom: 16px;
    }
    .sub {
      font-size: 17px; color: var(--t2); line-height: 1.65;
      margin-bottom: 52px;
    }

    /* Contact options */
    .contact-options { display: flex; flex-direction: column; gap: 14px; }

    .contact-card {
      display: flex; align-items: center; gap: 18px;
      padding: 20px 24px;
      background:
        radial-gradient(ellipse 90% 50% at 20% 0%, rgba(255,255,255,0.08) 0%, transparent 65%),
        rgba(255,255,255,0.05);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 4px 20px rgba(0,0,0,0.25);
      border-radius: 20px;
      text-decoration: none; color: var(--t1);
      transition: background .18s, border-color .18s, transform .18s;
    }
    .contact-card:hover {
      background:
        radial-gradient(ellipse 90% 50% at 20% 0%, rgba(255,255,255,0.12) 0%, transparent 65%),
        rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-1px);
    }
    .contact-card:active { transform: scale(.99); }

    .cc-icon {
      width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .cc-icon.email { background: linear-gradient(135deg, rgba(41,151,255,.25), rgba(41,151,255,.12)); border: 1px solid rgba(41,151,255,.25); }
    .cc-icon.wechat { background: linear-gradient(135deg, rgba(52,199,89,.25), rgba(52,199,89,.12)); border: 1px solid rgba(52,199,89,.25); }

    .cc-text { flex: 1; min-width: 0; }
    .cc-label { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
    .cc-value { font-size: 13px; color: var(--t2); margin-top: 3px; }

    .cc-arrow { color: var(--t3); font-size: 20px; font-weight: 300; flex-shrink: 0; }

    /* Footer */
    .page-footer { margin-top: 56px; font-size: 13px; color: var(--t3); text-align: center; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">TapTag</a>
  <a class="nav-back" href="/">← Back</a>
</nav>

<div class="page">
  <div class="eyebrow">Get in touch</div>
  <h1>Let's talk.</h1>
  <p class="sub">Interested in TapTag? Drop me a message and I'll get back to you.</p>

  <div class="contact-options">
    <a class="contact-card" href="mailto:williamdwkong@gmail.com">
      <div class="cc-icon email">✉️</div>
      <div class="cc-text">
        <div class="cc-label">Email</div>
        <div class="cc-value">williamdwkong@gmail.com</div>
      </div>
      <span class="cc-arrow">›</span>
    </a>
  </div>

  <p class="page-footer">Usually responds within 24 hours.</p>
</div>

</body>
</html>
