<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard – TapTag</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      min-height: 100vh;
      color: #1c1c1e;
      background:
        radial-gradient(ellipse 65% 55% at 12% 8%,  rgba(172,142,255,0.52) 0%, transparent 58%),
        radial-gradient(ellipse 55% 65% at 88% 88%, rgba(90,170,255,0.42)  0%, transparent 58%),
        radial-gradient(ellipse 80% 45% at 55% 50%, rgba(255,150,205,0.24) 0%, transparent 68%),
        #edf0f8;
      background-attachment: fixed;
    }

    /* ══ Liquid Glass ══ */
    .lg {
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(36px) saturate(170%);
      -webkit-backdrop-filter: blur(36px) saturate(170%);
      border: 1px solid rgba(255,255,255,0.58);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.78),
        inset 0 -1px 0 rgba(0,0,0,0.04),
        0 8px 32px rgba(0,0,0,0.07),
        0 2px 6px rgba(0,0,0,0.04);
    }

    /* ══ Nav ══ */
    nav {
      background: rgba(237,240,248,0.72);
      backdrop-filter: blur(44px) saturate(180%);
      -webkit-backdrop-filter: blur(44px) saturate(180%);
      border-bottom: 1px solid rgba(255,255,255,0.5);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.65), 0 1px 0 rgba(0,0,0,0.04);
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { font-weight: 700; font-size: 17px; letter-spacing: -0.3px; }
    .nav-link  { font-size: 15px; color: #007aff; text-decoration: none; }
    .nav-btn   { font-size: 15px; color: #007aff; background: none; border: none; cursor: pointer; font-family: inherit; }

    /* ══ Layout ══ */
    .container { max-width: 390px; margin: 0 auto; padding: 24px 16px 64px; }
    .sh  { font-size: 11px; color: rgba(60,60,67,0.55); font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 8px; padding-left: 6px; }
    .gap { margin-bottom: 22px; }

    /* ══ Tag header ══ */
    .tag-header { border-radius: 20px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; }
    .tag-name { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .tag-sub  { font-size: 12px; color: rgba(0,0,0,0.35); margin-top: 3px; font-family: 'SF Mono', ui-monospace, monospace; }
    .btn-rename { width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,0.06); border: 1px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; color: rgba(0,0,0,0.38); flex-shrink: 0; }
    .ne-wrap { display: flex; gap: 8px; align-items: center; margin-bottom: 22px; }
    .ne-wrap input { flex: 1; padding: 10px 14px; border: 1px solid rgba(255,255,255,0.6); border-radius: 14px; font-size: 15px; outline: none; background: rgba(255,255,255,0.55); backdrop-filter: blur(10px); font-family: inherit; }
    .ne-wrap input:focus { border-color: #007aff; }
    .btn-done { padding: 10px 16px; background: rgba(0,0,0,0.82); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-txt  { padding: 10px; background: none; border: none; font-size: 15px; color: rgba(0,0,0,0.38); cursor: pointer; font-family: inherit; }

    /* ══ Mode toggle ══ */
    .mode-row { border-radius: 18px; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
    .mode-lbl { font-size: 15px; font-weight: 600; }
    .mode-sub { font-size: 13px; color: rgba(0,0,0,0.42); margin-top: 2px; }
    .sw { width: 51px; height: 31px; border-radius: 31px; background: rgba(0,0,0,0.14); border: 1px solid rgba(255,255,255,0.4); cursor: pointer; position: relative; flex-shrink: 0; transition: background 0.26s cubic-bezier(0.4,0,0.2,1); }
    .sw.on { background: #34c759; border-color: #2aaa47; }
    .sw-t { position: absolute; width: 27px; height: 27px; background: white; border-radius: 50%; top: 1px; left: 1px; transition: transform 0.26s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 2px 8px rgba(0,0,0,0.2), 0 0 0 0.5px rgba(0,0,0,0.05); }
    .sw.on .sw-t { transform: translateX(20px); }

    /* ══════════════════════════════════
       RING — Direct mode (no card bg)
    ══════════════════════════════════ */

    /* Outer wrapper — centered, no background */
    .ring-outer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 0 4px;
    }

    /* Fixed 280×280 canvas */
    .ring-wrap {
      position: relative;
      width: 280px; height: 280px;
      touch-action: none;
      user-select: none;
    }

    /* SVG layer: ring track + drag beam */
    .ring-svg {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Center drag handle */
    .ring-cen {
      position: absolute;
      left: 140px; top: 140px;
      transform: translate(-50%, -50%);
      width: 54px; height: 54px;
      border-radius: 50%;
      background: rgba(255,255,255,0.42);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1.5px solid rgba(255,255,255,0.75);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.9),
        0 4px 18px rgba(0,0,0,0.10),
        0 1px 4px rgba(0,0,0,0.06);
      display: flex; align-items: center; justify-content: center;
      cursor: grab;
      z-index: 6;
      transition: transform .15s, box-shadow .15s;
    }
    .ring-cen.dragging {
      cursor: grabbing;
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,0.9),
        0 8px 28px rgba(0,0,0,0.18),
        0 2px 6px rgba(0,0,0,0.08);
      transform: translate(-50%,-50%) scale(0.93);
    }
    /* Four-dot drag icon */
    .ring-cen-icon {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      pointer-events: none;
    }
    .ring-cen-icon span {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(0,0,0,0.22);
    }

    /* Ring nodes */
    .rn {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      width: 50px; height: 50px;
      background: rgba(255,255,255,0.32);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border: 1.5px solid rgba(255,255,255,0.68);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.72),
        0 2px 10px rgba(0,0,0,0.08);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 4;
      opacity: 0.65;
      transition:
        width  .38s cubic-bezier(0.34,1.56,0.64,1),
        height .38s cubic-bezier(0.34,1.56,0.64,1),
        opacity .22s,
        background .22s,
        box-shadow .22s;
    }

    /* Hover during drag */
    .rn.hover {
      opacity: 0.88;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.72),
        0 4px 18px rgba(0,122,255,0.22),
        0 0 0 2px rgba(0,122,255,0.18);
    }

    /* Active / selected */
    .rn.active {
      width: 72px; height: 72px;
      opacity: 1;
      background: rgba(255,255,255,0.90);
      border-color: rgba(255,255,255,0.95);
      box-shadow:
        inset 0 1.5px 0 rgba(255,255,255,1),
        0 10px 32px rgba(0,0,0,0.15),
        0 0 0 2.5px rgba(0,122,255,0.28);
      z-index: 5;
    }

    /* Icons inside nodes */
    .rn img, .rn .rn-em {
      width: 26px; height: 26px;
      border-radius: 6px; flex-shrink: 0;
      pointer-events: none;
      transition: width .35s cubic-bezier(0.34,1.56,0.64,1),
                  height .35s cubic-bezier(0.34,1.56,0.64,1);
    }
    .rn .rn-em {
      background: rgba(0,0,0,0.06);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .rn.active img,
    .rn.active .rn-em { width: 36px; height: 36px; font-size: 20px; }

    /* Label — only on active */
    .rn-lbl {
      display: none;
      font-size: 10px; font-weight: 700; letter-spacing: -0.1px;
      color: #007aff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 68px; text-align: center;
      margin-top: 4px; line-height: 1;
      pointer-events: none;
    }
    .rn.active .rn-lbl { display: block; }

    /* ══ Grouped list ══ */
    .grouped { border-radius: 18px; overflow: hidden; }
    .g-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 56px; border-bottom: 1px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.08); }
    .g-row:last-child { border-bottom: none; }
    .g-icon  { width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0; }
    .g-icon-e{ width: 30px; height: 30px; border-radius: 7px; background: rgba(0,0,0,0.06); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .g-info  { flex: 1; min-width: 0; }
    .g-lbl   { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .g-url   { font-size: 12px; color: rgba(0,0,0,0.36); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .g-drag  { color: rgba(0,0,0,0.2); font-size: 18px; user-select: none; padding: 0 4px; }
    .g-btn   { background: none; border: none; padding: 6px 8px; cursor: pointer; color: rgba(0,0,0,0.22); font-size: 14px; border-radius: 8px; }
    .g-btn:hover { background: rgba(0,0,0,0.05); color: rgba(0,0,0,0.6); }
    .g-btn.del:hover { color: #ff3b30; }
    .ef { flex: 1; display: flex; flex-direction: column; gap: 7px; }
    .ef input { padding: 8px 11px; border: 1px solid rgba(255,255,255,0.55); border-radius: 10px; font-size: 14px; outline: none; background: rgba(255,255,255,0.55); backdrop-filter: blur(10px); font-family: inherit; }
    .ef input:focus { border-color: #007aff; background: rgba(255,255,255,0.85); }
    .ef-acts { display: flex; gap: 6px; }
    .bsave { padding: 7px 15px; background: rgba(0,0,0,0.82); color: white; border: none; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .bcanc { padding: 7px 13px; background: rgba(0,0,0,0.06); border: none; border-radius: 9px; font-size: 13px; cursor: pointer; font-family: inherit; }

    /* ══ Add form ══ */
    .add-card { border-radius: 20px; padding: 20px; }
    .af { margin-bottom: 10px; }
    .af label { display: block; font-size: 11px; color: rgba(60,60,67,0.52); font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .af input { width: 100%; padding: 11px 14px; border: 1px solid rgba(255,255,255,0.55); border-radius: 12px; font-size: 15px; outline: none; background: rgba(255,255,255,0.42); backdrop-filter: blur(10px); font-family: inherit; }
    .af input:focus { border-color: #007aff; background: rgba(255,255,255,0.72); }
    .badd { width: 100%; padding: 13px; margin-top: 8px; background: rgba(0,0,0,0.82); color: white; border: none; border-radius: 13px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .badd:active { opacity: 0.75; }
    .empty { color: rgba(0,0,0,0.25); font-size: 15px; text-align: center; padding: 32px 0; }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/" style="text-decoration:none;color:inherit;">TapTag</a>
  <div style="display:flex;gap:16px;align-items:center;">
    <a class="nav-link" href="/my-tags">My Tags</a>
    <button class="nav-btn" onclick="logout()">Log out</button>
  </div>
</nav>

<div class="container">
  <div id="header-area"></div>

  <p class="sh">Mode</p>
  <div class="mode-row lg gap">
    <div>
      <div class="mode-lbl" id="mode-lbl">Direct</div>
      <div class="mode-sub" id="mode-sub">Tap goes straight to active link</div>
    </div>
    <div class="sw" id="sw" onclick="toggleMode()"><div class="sw-t"></div></div>
  </div>

  <div id="links-area"></div>

  <p class="sh">Add Link</p>
  <div class="add-card lg">
    <div class="af"><label>Label</label><input type="text" id="new-label" placeholder="e.g. My Instagram"></div>
    <div class="af"><label>URL</label><input type="url" id="new-url" placeholder="https://..."></div>
    <button class="badd" onclick="addLink()">Add Link</button>
  </div>
</div>

<script>
  const TAG_ID = "{{ tag_id }}";
  let links = [], currentMode = 'DIRECT', linksLoaded = false, currentNickname = '';
  let displayOrder = [];
  let activeId = null;
  let _moveDrag = null, _endDrag = null; // kept at module scope for cleanup

  // ── Utils ─────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function favicon(url) {
    try { return `https://www.google.com/s2/favicons?sz=64&domain=${new URL(url).hostname}`; } catch { return null; }
  }
  function nodeIcon(url) {
    const s = favicon(url);
    return s
      ? `<img src="${s}" onerror="this.outerHTML='<div class=rn-em>🔗</div>'">`
      : `<div class="rn-em">🔗</div>`;
  }
  function rowIcon(url) {
    const s = favicon(url);
    return s ? `<img class="g-icon" src="${s}" onerror="this.style.display='none'">` : `<div class="g-icon-e">🔗</div>`;
  }
  function getOrderedLinks() {
    if (!displayOrder.length) return links;
    return displayOrder.map(id => links.find(l => l.id === id)).filter(Boolean);
  }

  // ── Header ────────────────────────────────────────────────────────────
  function renderHeader(editing=false) {
    const a = document.getElementById('header-area');
    if (editing) {
      a.innerHTML = `<div class="ne-wrap"><input id="ni" type="text" maxlength="50" placeholder="Tag name" value="${esc(currentNickname)}"><button class="btn-txt" onclick="renderHeader(false)">Cancel</button><button class="btn-done" onclick="saveNick()">Done</button></div>`;
      document.getElementById('ni').focus();
    } else {
      a.innerHTML = `<div class="tag-header lg gap"><div><div class="tag-name">${esc(currentNickname||TAG_ID)}</div><div class="tag-sub">${TAG_ID}</div></div><button class="btn-rename" onclick="renderHeader(true)">✎</button></div>`;
    }
  }
  async function saveNick() {
    const val = document.getElementById('ni')?.value.trim()||'';
    await fetch(`/tags/${TAG_ID}/nickname`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({nickname:val||null})});
    currentNickname=val; renderHeader(false);
  }

  // ── Mode ──────────────────────────────────────────────────────────────
  function applyMode(mode) {
    currentMode=mode;
    const d=mode==='DISPLAY';
    document.getElementById('sw').classList.toggle('on',d);
    document.getElementById('mode-lbl').textContent = d?'Display':'Direct';
    document.getElementById('mode-sub').textContent = d?'Tap shows all links':'Tap goes straight to active link';
    if (linksLoaded) renderLinks();
  }
  async function toggleMode() {
    const next=currentMode==='DIRECT'?'DISPLAY':'DIRECT';
    await fetch(`/tags/${TAG_ID}/mode`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:next})});
    applyMode(next);
  }
  async function loadMode() {
    const tags=await(await fetch('/tags/my')).json();
    const tag=tags.find(t=>t.id===TAG_ID);
    if(!tag) return;
    currentNickname=tag.nickname||''; renderHeader(false);
    applyMode(tag.mode||'DIRECT');
  }

  // ── Data ──────────────────────────────────────────────────────────────
  async function loadLinks() {
    const res=await fetch(`/links/${TAG_ID}`);
    if(res.status===401){window.location.href=`/activate?id=${TAG_ID}`;return;}
    links=await res.json(); linksLoaded=true;
    if(!displayOrder.length) { displayOrder=links.map(l=>l.id); }
    else {
      links.forEach(l=>{ if(!displayOrder.includes(l.id)) displayOrder.push(l.id); });
      displayOrder=displayOrder.filter(id=>links.some(l=>l.id===id));
    }
    activeId=links[0]?.id??null;
    renderLinks();
  }
  function renderLinks() {
    currentMode==='DIRECT'?renderRing():renderDraggable();
  }

  // ══════════════════════════════════════════════════════════════════════
  //  RING — no card background, center-drag interaction
  // ══════════════════════════════════════════════════════════════════════
  function renderRing() {
    const area=document.getElementById('links-area');
    const ordered=getOrderedLinks();
    if(!ordered.length){ area.innerHTML='<p class="empty">No links yet. Add one below.</p>'; return; }

    area.innerHTML=`
      <p class="sh">Active Link</p>
      <div class="ring-outer gap">
        <div class="ring-wrap" id="ring-wrap">
          <!-- SVG: track ring only -->
          <svg class="ring-svg" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
            <!-- Outer glow ring -->
            <circle cx="140" cy="140" r="98"
              fill="none"
              stroke="rgba(255,255,255,0.18)"
              stroke-width="12"/>
            <!-- Track stroke -->
            <circle cx="140" cy="140" r="98"
              fill="none"
              stroke="rgba(255,255,255,0.50)"
              stroke-width="1.2"/>
          </svg>
          <!-- Nodes -->
          ${ordered.map((l,i)=>`
            <div class="rn${l.id===activeId?' active':''}" data-id="${l.id}" data-i="${i}">
              ${nodeIcon(l.url)}
              <span class="rn-lbl">${esc(l.label)}</span>
            </div>`).join('')}
          <!-- Center drag handle -->
          <div class="ring-cen" id="ring-cen">
            <div class="ring-cen-icon">
              <span></span><span></span>
              <span></span><span></span>
            </div>
          </div>
        </div>
      </div>
      <p class="sh">All Links</p>
      <div class="grouped lg gap">
        ${ordered.map(l=>`
          <div class="g-row" data-id="${l.id}" id="item-${l.id}">
            ${rowIcon(l.url)}
            <div class="g-info"><div class="g-lbl">${esc(l.label)}</div><div class="g-url">${esc(l.url)}</div></div>
            <button class="g-btn" onclick="startEdit(${l.id},${JSON.stringify(l.label)},${JSON.stringify(l.url)})">✎</button>
            <button class="g-btn del" onclick="deleteLink(${l.id})">✕</button>
          </div>`).join('')}
      </div>`;

    positionNodes();
    bindRing();
  }

  const CX=140, CY=140, R=98;

  function positionNodes() {
    const nodes=document.querySelectorAll('.rn');
    const n=nodes.length;
    nodes.forEach((node,i)=>{
      const a=(2*Math.PI*i/n)-Math.PI/2;
      node.style.left=(CX+R*Math.cos(a))+'px';
      node.style.top =(CY+R*Math.sin(a))+'px';
    });
  }

  function bindRing() {
    // Remove any lingering window listeners from a previous render
    if (_moveDrag) window.removeEventListener('pointermove', _moveDrag);
    if (_endDrag)  window.removeEventListener('pointerup',   _endDrag);

    const cen  = document.getElementById('ring-cen');
    const wrap = document.getElementById('ring-wrap');
    let dragging=false, hoveredId=null;

    // Desktop: direct click on any node
    document.querySelectorAll('.rn').forEach(node=>{
      node.addEventListener('click', ()=>selectNode(parseInt(node.dataset.id)));
    });

    // Pointer position relative to ring-wrap
    function relPt(e) {
      const r=wrap.getBoundingClientRect();
      const src=e.touches?e.touches[0]:e;
      return { x:src.clientX-r.left, y:src.clientY-r.top };
    }

    // Nearest node within 70px
    function nearestNode(x,y) {
      let best=null, bestD=Infinity;
      document.querySelectorAll('.rn').forEach(n=>{
        const nx=parseFloat(n.style.left), ny=parseFloat(n.style.top);
        const d=Math.hypot(x-nx,y-ny);
        if(d<bestD){bestD=d;best=n;}
      });
      return bestD<70?best:null;
    }

    function startDrag(e) {
      dragging=true;
      cen.classList.add('dragging');
      e.preventDefault();
    }

    _moveDrag = function(e) {
      if(!dragging) return;
      const {x,y}=relPt(e);

      // Dock-style magnification: smoothstep falloff within 130px
      document.querySelectorAll('.rn').forEach(n=>{
        const nx=parseFloat(n.style.left), ny=parseFloat(n.style.top);
        const dist=Math.hypot(x-nx, y-ny);
        const t=Math.max(0, 1-dist/130);
        const ease=t*t*(3-2*t); // smoothstep
        const base=n.classList.contains('active')?72:50;
        const max =n.classList.contains('active')?88:72;
        const sz=base+(max-base)*ease;
        n.style.width =sz+'px';
        n.style.height=sz+'px';
        n.style.transition='width .06s,height .06s'; // near-instant during drag
        n.style.opacity=n.classList.contains('active')?'1':(0.62+0.38*ease).toFixed(3);
        n.style.zIndex=n.classList.contains('active')?'5':Math.round(2+ease*3);
      });

      // Nearest-node hover highlight
      const node=nearestNode(x,y);
      document.querySelectorAll('.rn').forEach(n=>n.classList.remove('hover'));
      if(node) node.classList.add('hover');
      hoveredId=node?parseInt(node.dataset.id):null;
      e.preventDefault();
    };

    _endDrag = function() {
      if(!dragging) return;
      dragging=false;
      cen.classList.remove('dragging');
      // Restore CSS-driven sizes
      document.querySelectorAll('.rn').forEach(n=>{
        n.style.width=''; n.style.height='';
        n.style.opacity=''; n.style.transition=''; n.style.zIndex='';
        n.classList.remove('hover');
      });
      if(hoveredId!==null) selectNode(hoveredId);
      hoveredId=null;
    };

    cen.addEventListener('pointerdown', startDrag);
    window.addEventListener('pointermove', _moveDrag, {passive:false});
    window.addEventListener('pointerup',   _endDrag);
  }

  async function selectNode(id) {
    if(id===activeId) return;
    activeId=id;
    document.querySelectorAll('.rn').forEach(n=>{
      n.classList.toggle('active', parseInt(n.dataset.id)===id);
    });

    const ordered=getOrderedLinks();
    const picked=ordered.find(l=>l.id===id);
    const reordered=[picked,...ordered.filter(l=>l.id!==id)];
    await fetch(`/links/${TAG_ID}/reorder`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({link_ids:reordered.map(l=>l.id)})
    });
    links=reordered;
  }

  // ══ Display mode ══════════════════════════════════════════════════════
  function renderDraggable() {
    const area=document.getElementById('links-area');
    const ordered=getOrderedLinks();
    if(!ordered.length){ area.innerHTML='<p class="sh">Links</p><p class="empty">No links yet.</p>'; return; }
    area.innerHTML=`
      <p class="sh">Links</p>
      <div class="grouped lg gap" id="dlist">
        ${ordered.map(l=>`
          <div class="g-row" data-id="${l.id}" id="item-${l.id}" style="cursor:grab;">
            <span class="g-drag">⠿</span>
            ${rowIcon(l.url)}
            <div class="g-info"><div class="g-lbl">${esc(l.label)}</div><div class="g-url">${esc(l.url)}</div></div>
            <button class="g-btn" onclick="startEdit(${l.id},${JSON.stringify(l.label)},${JSON.stringify(l.url)})">✎</button>
            <button class="g-btn del" onclick="deleteLink(${l.id})">✕</button>
          </div>`).join('')}
      </div>`;
    Sortable.create(document.getElementById('dlist'),{animation:200,handle:'.g-drag',
      onEnd:async()=>{
        const ids=[...document.querySelectorAll('#dlist .g-row')].map(el=>parseInt(el.dataset.id));
        await fetch(`/links/${TAG_ID}/reorder`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({link_ids:ids})});
        displayOrder=ids;
        links=ids.map(id=>links.find(l=>l.id===id)).filter(Boolean);
      }});
  }

  // ══ CRUD ══════════════════════════════════════════════════════════════
  async function addLink() {
    const label=document.getElementById('new-label').value.trim();
    const url=document.getElementById('new-url').value.trim();
    if(!label||!url) return;
    await fetch(`/links/${TAG_ID}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label,url})});
    document.getElementById('new-label').value='';
    document.getElementById('new-url').value='';
    loadLinks();
  }
  function startEdit(id,label,url) {
    const row=document.getElementById(`item-${id}`);
    row.innerHTML=`<div class="ef"><input type="text" id="el${id}" value="${esc(label)}" placeholder="Label"><input type="url" id="eu${id}" value="${esc(url)}" placeholder="https://..."><div class="ef-acts"><button class="bsave" onclick="saveEdit(${id})">Save</button><button class="bcanc" onclick="loadLinks()">Cancel</button></div></div>`;
    document.getElementById(`el${id}`).focus();
  }
  async function saveEdit(id) {
    const label=document.getElementById(`el${id}`).value.trim();
    const url=document.getElementById(`eu${id}`).value.trim();
    if(!label||!url) return;
    await fetch(`/links/${TAG_ID}/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({label,url})});
    loadLinks();
  }
  async function deleteLink(id) {
    if(!confirm('Delete this link?')) return;
    await fetch(`/links/${TAG_ID}/${id}`,{method:'DELETE'});
    displayOrder=displayOrder.filter(did=>did!==id);
    if(activeId===id) activeId=null;
    loadLinks();
  }
  async function logout() {
    await fetch('/users/logout',{method:'POST'});
    window.location.href='/login';
  }

  // ── Init ──────────────────────────────────────────────────────────────
  renderHeader(false);
  loadMode();
  loadLinks();
</script>
</body>
</html>
